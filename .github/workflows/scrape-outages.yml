name: Scrape Fuel Outages

on:
  schedule:
    - cron: '0 19 * * 6'  # Weekly: Sat 19:00 UTC = Sun 05:00 AEST
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scraper
          npm ci

      - name: Run scraper
        run: |
          cd scraper
          node scrape-outages.js

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add frontend/web/public/data/outages.json
          if ! git diff --staged --quiet; then
            git commit -m "[skip ci] data: update fuel outages $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --no-rebase origin main || true
            git checkout --theirs frontend/web/public/data/outages.json
            git add frontend/web/public/data/outages.json
            git commit --amend --no-edit || true
            git push origin main
          fi
